services:

  frontend:
    build: ./frontend
    container_name: react-app
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: react_backend
    ports:
      - "4000:4000"
    environment:
      - DB_USER=root
      - DB_HOST=db
      - DB_DATABASE=app_db
      - DB_PASSWORD=MyNewPass123!
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    container_name: database
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=MyNewPass123!
      - MYSQL_DATABASE=app_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pMyNewPass123!"]
      interval: 5s
      timeout: 5s
      retries: 10