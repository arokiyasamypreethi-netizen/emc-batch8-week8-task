version: '3.8'

services:

  frontend:
    build: ./frontend
    container_name: react-app
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:4000
    depends_on:
      - backend

  backend:
    depends_on:
      - db
    container_name: react_backend
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - DB_USER=root
      - DB_HOST=db
      - DB_DATABASE=app_db
      - DB_PASSWORD=MyNewPass123!

  db:
    image: mysql:8
    container_name: database
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=MyNewPass123!
      - MYSQL_DATABASE=app_db
